<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/trip-dashboard/icon.svg">
<title>Trip Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  /* Same palette/type tokens as every trip page (see DEV_NOTES.md "What
     this is" — the design language is established, match it). This page
     doesn't need the ~800 lines of itinerary/checklist/budget component
     CSS those pages carry — it's just a header and a list of links. */
  :root {
    --ink: #16233F;
    --ink-soft: #4A5872;
    --paper: #FAF9F5;
    --paper-dim: #F0EEE6;
    --brass: #B8862F;
    --brass-soft: #E8D9B8;
    --teal: #2F6E63;
    --line: #D9D5C7;
    --card: #FFFFFF;
    --radius: 2px;
    --font-display: 'Fraunces', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper-dim); color: var(--ink); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }

  .stub { background: var(--ink); color: var(--paper); border-radius: var(--radius); padding: 28px 28px 24px; margin-bottom: 24px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-soft); margin: 0 0 10px; }
  .stub h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 6vw, 40px); margin: 0 0 6px; line-height: 1.05; }
  .stub p { font-family: var(--font-mono); font-size: 13px; color: var(--paper-dim); opacity: 0.75; margin: 0; }

  .trip-list { display: flex; flex-direction: column; gap: 24px; }
  .trip-section { margin: 0; }
  .trip-section-list { display: flex; flex-direction: column; gap: 12px; }
  .section-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass); font-weight: 600; margin: 0 0 10px; cursor: pointer; list-style: none; user-select: none; }
  .section-label::-webkit-details-marker { display: none; }
  .section-label::before { content: '▸'; display: inline-block; width: 1em; color: var(--brass); transition: transform 0.15s ease; }
  .trip-section[open] > .section-label::before { transform: rotate(90deg); }
  .trip-card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color 0.15s ease; }
  .trip-card:hover { border-color: var(--brass); }
  .trip-card h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px; color: var(--ink); }
  .trip-card p { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.5; }

  .empty, .error { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .error { color: #A8455A; }

  footer { margin-top: 40px; padding-top: 14px; border-top: 1px dashed var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="stub">
    <p class="eyebrow">Road Trip Dashboard</p>
    <h1>Trip Dashboard</h1>
    <p>Pick a trip below.</p>
  </div>

  <div class="trip-list" id="tripList">
    <p class="empty">Loading trips…</p>
  </div>

  <footer>To start a new trip, see DEV_NOTES.md — "To start a new real trip."</footer>
</div>

<script type="module">
  // Reads trips.json (kept up to date automatically by scripts/new-trip.mjs
  // — see DEV_NOTES.md "Extract shared engine into app.js" / the landing
  // page Feature notes entry) rather than trying to enumerate folders:
  // GitHub Pages is plain static hosting with no directory-listing API, so
  // a maintained manifest file is the only way to know what trips exist.
  // trips.json's own startDate/endDate are used only as a fallback now —
  // see liveDateRange() below for why.
  const listEl = document.getElementById('tripList');

  // Firebase Realtime Database's plain REST API (public reads are
  // CORS-enabled by default — this is the documented way to read RTDB data
  // from a browser without the SDK), not the firebase-database SDK: this
  // page deliberately doesn't import app.js/Firebase itself (see the
  // service-worker-registration comment below), and a couple of one-shot
  // GETs don't need the SDK's live-subscription machinery anyway.

  // Same local-date approach as todayISO() in app.js (getFullYear/getMonth/
  // getDate, not toISOString) to avoid UTC-vs-local date shifting.
  function todayISO() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  const DB_URL = 'https://trip-dashboard-c6f8a-default-rtdb.asia-southeast1.firebasedatabase.app';

  // Live date range for one trip, computed from its actual itinerary —
  // same min/max-of-dated-days logic as updateTripStatus() in app.js, just
  // fetched here via plain REST instead of the SDK's live listener. This
  // is what actually fixes the "trip edited in-app doesn't re-bucket on
  // the landing page until someone remembers to update trips.json by
  // hand" gap: trips.json's startDate/endDate are now only a fallback,
  // used when this fetch fails (offline, network hiccup) or the trip has
  // no dated itinerary rows yet (e.g. a freshly-scaffolded blank trip).
  function liveDateRange(slug) {
    return fetch(`${DB_URL}/trips/${slug}/itinerary.json`)
      .then(res => res.ok ? res.json() : null)
      .then(itinerary => {
        if (!itinerary) return null;
        const dates = Object.values(itinerary).map(d => d.date).filter(Boolean).sort();
        if (!dates.length) return null;
        return { startDate: dates[0], endDate: dates[dates.length - 1] };
      })
      .catch(() => null);
  }

  function tripCardEl(trip) {
    const a = document.createElement('a');
    a.className = 'trip-card';
    a.href = `./${trip.slug}/`;
    a.innerHTML = `<h2></h2><p></p>`;
    a.querySelector('h2').textContent = trip.title || trip.slug;
    a.querySelector('p').textContent = trip.subtitle || '';
    return a;
  }
  // <details>/<summary> gives expand/collapse for free — no JS state to
  // track, works without a click handler. Current Trips defaults open
  // (that's what you're here for); Past Trips defaults collapsed, since
  // the point is to get past trips out of the way once there are several.
  function sectionEl(label, trips, openByDefault) {
    const section = document.createElement('details');
    section.className = 'trip-section';
    section.open = openByDefault;
    const summary = document.createElement('summary');
    summary.className = 'section-label';
    summary.textContent = label;
    section.appendChild(summary);
    const list = document.createElement('div');
    list.className = 'trip-section-list';
    trips.forEach(trip => list.appendChild(tripCardEl(trip)));
    section.appendChild(list);
    return section;
  }

  // Groups by each trip's startDate/endDate — by this point in the fetch
  // chain (see below) these have already been overwritten with the live
  // itinerary-derived range where available, trips.json's copy only
  // surviving as a fallback. A trip missing both falls into Current Trips
  // rather than being silently dropped.
  function renderTripList(trips) {
    const today = todayISO();
    const current = [];
    const past = [];
    trips.forEach(trip => {
      if (trip.endDate && trip.endDate < today) past.push(trip);
      else current.push(trip);
    });
    current.sort((a, b) => (a.startDate || '9999-99-99').localeCompare(b.startDate || '9999-99-99'));
    past.sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));

    listEl.innerHTML = '';
    if (!current.length && !past.length) {
      listEl.innerHTML = '<p class="empty">No trips yet — see DEV_NOTES.md "To start a new real trip."</p>';
      return;
    }
    if (current.length) listEl.appendChild(sectionEl('Current Trips', current, true));
    if (past.length) listEl.appendChild(sectionEl('Past Trips', past, false));
  }

  fetch('trips.json')
    .then(res => {
      if (!res.ok) throw new Error(`trips.json: HTTP ${res.status}`);
      return res.json();
    })
    .then(trips => {
      if (!Array.isArray(trips)) throw new Error('trips.json is not an array');
      // Fetch every trip's live date range in parallel, overlaying it onto
      // trips.json's copy (Object.assign keeps the static value when
      // liveDateRange() returns null — see its own comment for when that
      // happens). A slow/failed lookup for one trip never blocks the
      // others or the page as a whole.
      return Promise.all(trips.map(trip =>
        liveDateRange(trip.slug).then(live => Object.assign({}, trip, live || {}))
      ));
    })
    .then(trips => renderTripList(trips))
    .catch(err => {
      listEl.innerHTML = '<p class="error">Couldn’t load the trip list — check trips.json.</p>';
      console.error(err);
    });

  // Same registration app.js does for every trip page — duplicated here
  // (rather than importing app.js, which pulls in Firebase this static
  // page has no use for) so a visitor whose first-ever visit is this
  // landing page still gets offline/PWA coverage.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/trip-dashboard/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
