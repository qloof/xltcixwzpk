<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16233F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="/trip-dashboard/icon.svg">
<title>Trip Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  /* Same palette/type tokens as every trip page (see DEV_NOTES.md "What
     this is" — the design language is established, match it). This page
     doesn't need the ~800 lines of itinerary/checklist/budget component
     CSS those pages carry — it's just a header and a list of links. */
  :root {
    --ink: #16233F;
    --ink-soft: #4A5872;
    --paper: #FAF9F5;
    --paper-dim: #F0EEE6;
    --brass: #B8862F;
    --brass-soft: #E8D9B8;
    --teal: #2F6E63;
    --line: #D9D5C7;
    --card: #FFFFFF;
    --radius: 2px;
    --font-display: 'Fraunces', serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper-dim); color: var(--ink); font-family: var(--font-body); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 20px 80px; }

  .stub { background: var(--ink); color: var(--paper); border-radius: var(--radius); padding: 28px 28px 24px; margin-bottom: 24px; }
  .eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--brass-soft); margin: 0 0 10px; }
  .stub h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 6vw, 40px); margin: 0 0 6px; line-height: 1.05; }
  .stub p { font-family: var(--font-mono); font-size: 13px; color: var(--paper-dim); opacity: 0.75; margin: 0; }

  .trip-list { display: flex; flex-direction: column; gap: 12px; }
  .trip-card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; text-decoration: none; color: inherit; transition: border-color 0.15s ease; }
  .trip-card:hover { border-color: var(--brass); }
  .trip-card h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0 0 4px; color: var(--ink); }
  .trip-card p { font-family: var(--font-mono); font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.5; }

  .empty, .error { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); }
  .error { color: #A8455A; }

  footer { margin-top: 40px; padding-top: 14px; border-top: 1px dashed var(--line); font-family: var(--font-mono); font-size: 11px; color: var(--ink-soft); text-align: center; }
</style>
</head>
<body>
<div class="wrap">

  <div class="stub">
    <p class="eyebrow">Road Trip Dashboard</p>
    <h1>Trip Dashboard</h1>
    <p>Pick a trip below.</p>
  </div>

  <div class="trip-list" id="tripList">
    <p class="empty">Loading trips…</p>
  </div>

  <footer>To start a new trip, see DEV_NOTES.md — "To start a new real trip."</footer>
</div>

<script type="module">
  // Reads trips.json (kept up to date automatically by scripts/new-trip.mjs
  // — see DEV_NOTES.md "Extract shared engine into app.js" / the landing
  // page Feature notes entry) rather than trying to enumerate folders:
  // GitHub Pages is plain static hosting with no directory-listing API, so
  // a maintained manifest file is the only way to know what trips exist.
  const listEl = document.getElementById('tripList');
  fetch('trips.json')
    .then(res => {
      if (!res.ok) throw new Error(`trips.json: HTTP ${res.status}`);
      return res.json();
    })
    .then(trips => {
      if (!Array.isArray(trips) || !trips.length) {
        listEl.innerHTML = '<p class="empty">No trips yet — see DEV_NOTES.md "To start a new real trip."</p>';
        return;
      }
      listEl.innerHTML = '';
      trips.forEach(trip => {
        const a = document.createElement('a');
        a.className = 'trip-card';
        a.href = `./${trip.slug}/`;
        a.innerHTML = `<h2></h2><p></p>`;
        a.querySelector('h2').textContent = trip.title || trip.slug;
        a.querySelector('p').textContent = trip.subtitle || '';
        listEl.appendChild(a);
      });
    })
    .catch(err => {
      listEl.innerHTML = '<p class="error">Couldn’t load the trip list — check trips.json.</p>';
      console.error(err);
    });

  // Same registration app.js does for every trip page — duplicated here
  // (rather than importing app.js, which pulls in Firebase this static
  // page has no use for) so a visitor whose first-ever visit is this
  // landing page still gets offline/PWA coverage.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/trip-dashboard/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
